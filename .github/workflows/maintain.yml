name: Maintain

# Retention: a nightly job expires overdue reports, prunes raw readings
# past 14 days and clears IP hashes past 7 days.
# 19:00 UTC is 02:00 Asia/Bangkok — the quietest hour for our users.
on:
  schedule:
    - cron: "0 19 * * *"
  workflow_dispatch:

concurrency:
  group: maintain
  cancel-in-progress: false

jobs:
  maintain:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    steps:
      - name: Run maintenance
        env:
          BASE_URL: ${{ vars.PUBLIC_BASE_URL }}
          INGEST_SECRET: ${{ secrets.INGEST_SECRET }}
        run: |
          if [ -z "$BASE_URL" ] || [ -z "$INGEST_SECRET" ]; then
            echo "::error::Set the PUBLIC_BASE_URL variable and the INGEST_SECRET secret"
            exit 1
          fi
          code=$(curl -sS -o response.json -w '%{http_code}' --max-time 120 \
            --retry 2 --retry-delay 10 \
            -X POST "$BASE_URL/api/internal/maintain" \
            -H "x-ingest-secret: $INGEST_SECRET" || echo 000)
          echo "HTTP $code"
          # Runs under `bash -e`: a missing response file would abort the step
          # before the status is ever checked.
          [ -f response.json ] && head -c 2000 response.json || true
          echo

          # Retention is a promise made to users in the privacy notice, so a
          # silent failure here is not acceptable — name the cause.
          if [ "$code" = "401" ]; then
            echo "::error::Rejected: INGEST_SECRET does not match the deployment"
            exit 1
          fi
          if [ "$code" != "200" ]; then
            echo "::error::Maintenance did not run (HTTP $code) — retention is overdue"
            exit 1
          fi
