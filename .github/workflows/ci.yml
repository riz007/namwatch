name: CI

on:
  push:
    branches: [main]
  pull_request:

# CI never touches upstream sources: adapter tests run against
# committed fixtures only.
env:
  CI: 'true'

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v5

      - uses: pnpm/action-setup@v4
        with:
          version: 11.9.0

      - uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: pnpm

      - run: pnpm install --frozen-lockfile

      - name: Secret scan
        run: pnpm check:secrets

      - name: Typecheck
        run: pnpm typecheck

      - name: Lint
        run: pnpm lint

      - name: Unit tests
        run: pnpm test

      - name: i18n key parity
        run: pnpm i18n:check

      - name: Depth ramp colour-vision safety
        run: pnpm check:cvd

      - name: Depth tokens are in step with the config
        run: |
          pnpm tokens:generate
          git diff --exit-code src/styles/depth-tokens.css \
            || (echo "::error::depth-tokens.css is stale — run 'pnpm tokens:generate' and commit"; exit 1)
